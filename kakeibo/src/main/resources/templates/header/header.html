<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
	</head>
	<body>
		<header th:fragment="header">
			<div class="header_area">
				<div class="header_top">
					<h1 class="header_title">
						【家計簿管理システム】
					</h1>
					<a class="logout_btn" th:href="@{/user/logout}" onclick="return confirm('ログアウトしますか？');">
						ログアウト
					</a>
				</div>
				
				<nav>
					<ul class="header_link_list">
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/top}">
								＜TOP＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/input}">
								＜収支入力＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/list}">
								＜一覧＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/category}">
								＜カテゴリ＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/calendar}">
								＜カレンダー＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/comparison}">
								＜比較表＞
							</a>
						</li>
						<li>
							<a class="header_link" draggable="false" th:href="@{/balance/mypage}">
								＜マイページ＞
							</a>
						</li>
					</ul>
				</nav>
				<form class="search_area" th:action="@{/balance/list}" method="get">
					<label for="keywordSelect">
						キーワード
					</label>
					<input id="keywordSelect" name="keyword" type="text" th:value="${selectedKeyword}" placeholder="キーワード検索">
					<label for="monthSelect">
						年月
					</label>
					<input id="monthSelect" name="month" type="month" th:value="${selectedMonth}">
					<label for="sortSelect">
						並び替え
					</label>
					<select id="sortSelect" name="sort">
						<option value="date" th:selected="${selectedSort == null or selectedSort == 'date'}">
							日付順
						</option>
						<option value="no" th:selected="${selectedSort == 'no'}">
							No.昇順
						</option>
						<option value="amountAsc" th:selected="${selectedSort == 'amountAsc'}">
							金額昇順
						</option>
						<option value="amountDesc" th:selected="${selectedSort == 'amountDesc'}">
							金額降順
						</option>
					</select>
					<button id="searchBtn" type="submit">
						検索
					</button>
				</form>
			</div>
			<script th:src="@{/header/header.js}" defer></script>
		</header>
	</body>
</html>
